name: ClauseLens Ragas Evaluation CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ragas-quality-gate:
    name: Ragas Retrieval & Generation Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Unit Tests
        run: |
          pytest backend/tests/ -v

      - name: Execute Ragas Benchmark Evaluation Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m backend.src.evaluation.ragas_runner

      - name: Upload Evaluation Scorecard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-scorecard
          path: |
            evaluation_report.md
            evaluation_results.json

